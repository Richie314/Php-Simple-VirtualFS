name: Tests (Docker)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the PHP test image
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: docker build --build-arg "PHP_VERSION=$PHP_VERSION" --file demo/Dockerfile --tag virtualfs-tests .

      - name: Validate Composer metadata, lint PHP, and run smoke tests
        run: |
          docker run --rm --env COMPOSER_ALLOW_SUPERUSER=1 virtualfs-tests sh -euc '
            composer validate --no-check-publish
            find src tests demo -name "*.php" -exec php -l {} +
            composer test
          '
